<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <link rel="stylesheet" href="/codigo/css/login.css">
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
    </head>
    <body>
        <div class="layout"></div>
        <div class="topbar">    
            <a href="/codigo/html/tela_home.html" ><img src="/imagens/logo.png" class="logo"></a>
        </div>

        <div class="page">
            <form method="POST" class="formLogin">
                <h1>Login</h1>
                <p>Digite os seus dados de acesso no campo abaixo.</p>
                <label for="email">E-mail</label>
                <input type="email" placeholder="Digite seu e-mail" autofocus="true"  />
                <label for="password">Senha</label>
                <input type="password" placeholder="Digite sua senha" />
                <nav>
                <a href="/codigo/html/esqueci_email.html">Esqueci minha senha</a>
                <a href="/codigo/html/registrar.html">Registrar</a>
                </nav>
                <input type="submit" value="Acessar" class="btn" />

            </form>
        </div>
        
    </body>
</html>
