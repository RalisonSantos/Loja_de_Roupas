<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link rel="stylesheet" href="/css/registrar.css">
</head>

<body>
    <div class="layout"></div>
    <div class="topbar">
        <a href="/html/tela_home.html"><img src="/imagens/logo.png" class="logo" /></a>
    </div>

    <div class="page">
        <form method="POST" class="formRegistrar">
            <h1>Registrar</h1>
            <p>Digite os seus dados de acesso no campo abaixo.</p>


            <label for="Nome">Nome</label>
            <input type="text" placeholder="Digite seu Nome" autofocus="true" /><br>
            <label for="Sobrenome">Sobrenome</label>
            <input type="text" placeholder="Digite seu Sobrenome" autofocus="true" />

            <label for="email">E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" autofocus="true" />
            <label for="password">Senha</label>
            <input type="password" placeholder="Digite sua senha" />

            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" placeholder="Data de Nascimento" autofocus="true" />

            <input type="submit" value="Criar uma conta" class="btn" />

        </form>
    </div>
</body>

</html>
