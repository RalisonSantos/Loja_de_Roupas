<!DOCTYPE html>
<html>
    <head>
        <title>F&L-Style</title>
        <link rel="stylesheet" href="/codigo/css/tela_home.css">
        <script src="/codigo/js/slide.js" defer></script>
        <script src="/codigo/js/pacote.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    </head>

    <body>
        <div class="layout">
            <div class="topbar">
                <nav>
                    <a href="/codigo/html/login.html">Entrar</a>
                    <a href="/codigo/html/registrar.html">Registrar</a>
                </nav>
            </div>

            <div class="topbar2">
                <a href="/codigo/html/tela_home.html"><img src="/imagens/logo.png" /></a>
                <nav>
                    <a href="#">Mais Vendidos</a>
                    <a href="/codigo/html/lancamentos.html">Lançamentos</a>
                    <a href="#">Categorias</a>
                    <a href="#">Ofertas</a>
                </nav>
            </div>

            <div class="Meio">
                <div class="mbanner">
                    <img src="/imagens/banner9.jpg" alt="">
                </div>

                <div class="mtxt">
                    <h3>Registra-se gratuitamente e se torne um Membro F&L</h3>
                </div>

                <div class="mbtn">
                    <a href="#">Registra-se</a>
                </div>

                <section class="slide">
                    <div class="slide-cont">
                        <input type="radio" name="btn-radio" id="radio1">
                        <input type="radio" name="btn-radio" id="radio2">
                        <input type="radio" name="btn-radio" id="radio3">

                        <div class="slide-box primeiro">
                            <img src="/imagens/1.jpg" alt="slide 1">
                        </div>

                        <div class="slide-box ">
                            <img src="/imagens/2.jpg" alt="slide 1">
                        </div>

                        <div class="slide-box ">
                            <img src="/imagens/3.jpg" alt="slide 1">
                        </div>

                        <div class="auto-nav">
                            <div class="auto-btn1"></div>
                            <div class="auto-btn2"></div>
                            <div class="auto-btn3"></div>
                        </div>

                        <div class="manu-nav">
                            <label for="radio1" class="manual-btn"></label>
                            <label for="radio2" class="manual-btn"></label>
                            <label for="radio3" class="manual-btn"></label>
                        </div>
                    </div>
                </section>

                <div class="pacote">
                    <i class="fa-solid fa-angle-left"></i>
                    <ul class="carrossel">
                        <li class="card">
                            <div class="img"><img src="/imagens/8.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/14.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/10.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/11.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/12.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/13.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/15.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                        <li class="card">
                            <div class="img"><img src="/imagens/16.jpg" alt="img"></div>
                            <a href="#">Ver Tudo</a>
                        </li>
                    </ul>
                    <i class="fa-solid fa-angle-right"></i>
                </div>

            </div>

        </div>

    </body>

</html>
