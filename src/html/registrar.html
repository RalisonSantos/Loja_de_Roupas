<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Registrar</title>
    <link rel="stylesheet" href="../css/registrar.css">
</head>

<body>
    <div class="layout"></div>
    <div class="topbar">
        <a href="../html/index.html"><img src="../imagens/logo.png" class="logo" /></a>
    </div>

    <div class="page">
        <form method="POST" class="formRegistrar">
            <h1>Registrar</h1>
            <p>Digite os seus dados de acesso no campo abaixo.</p>

            <label for="Nome">Nome</label>
            <input type="text" placeholder="Digite seu Nome" autofocus="true" /><br>

            <label for="email">E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" autofocus="true" />
            <label for="password">Senha</label>
            <input type="password" placeholder="Digite sua senha" />

            <label for="dataNascimento">Data de Nascimento</label>
            <input type="date" placeholder="Data de Nascimento" autofocus="true" />

            <input type="submit" value="Criar uma conta" class="btn" />

        </form>
    </div>
</body>

</html>
