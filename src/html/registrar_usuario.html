<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Registrar</title>
    <link rel="stylesheet" href="../css/registrar.css">
</head>

<body>
    <div class="layout">
        <div class="topbar">
            <a href="../index.html"><img src="../imagens/logo3.png" class="iclogo"/></a>
            <span class="top1"></span>
            <div class="navegacao">
                <ul>
                    <li class="lista ativado">
                        <a href="../php/login_fornecedor/tela_login.php">
                            <span class="icon"><ion-icon name="arrow-back-outline"></ion-icon></span>
                            <span class="titulo">Voltar</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="page">
            <form method="POST" action="../php/usuario/salvar.php" class="formRegistrar">
            
                <h1>Registrar</h1>
                <p>Digite os seus dados de acesso no campo abaixo.</p>

                <label for="nome">Nome</label>
                <input type="text" placeholder="Digite seu Nome" autofocus="true" id="nome" name="nome" />

                <label for="email">E-mail</label>
                <input type="email" placeholder="Digite seu e-mail" autofocus="true" id="email" name="email" />

                <label for="senha">Senha</label>
                <input type="password" placeholder="Digite sua senha" name="senha" id="senha"/>

                <label for="data">Data de Nascimento</label>
                <input type="date" placeholder="Data de Nascimento" autofocus="true" id="data" name="data" />

                <input type="submit" value="Criar uma conta" class="btn" />

            </form>
        </div>
    </div>
</body>

</html>
